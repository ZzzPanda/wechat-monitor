vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 55GiB
images:
- location: @GUEST@
  arch: aarch64
mountType: virtiofs
mounts:
- location: @MEDIA@
  writable: true
- location: @STATE@
  writable: true
ssh:
  loadDotSSHPubKeys: false
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    test -x /usr/bin/dockerd
    # The minimal guest has the resolved stub symlink but no resolved daemon.
    # Restore the stub on each boot using the DNS supplied to this VM by DHCP.
    if [ -L /etc/resolv.conf ] && [ ! -e /etc/resolv.conf ] &&
       [ "$(readlink -m /etc/resolv.conf)" = /run/systemd/resolve/stub-resolv.conf ]; then
      install -d /run/systemd/resolve
      stub=$(mktemp /run/systemd/resolve/.dns.XXXXXX)
      awk '/^DNS=/ {sub(/^DNS=/, ""); for (i=1; i<=NF; i++) print "nameserver", $i}' \
        /run/systemd/netif/leases/* > "$stub"
      test -s "$stub"
      chmod 644 "$stub"
      mv "$stub" /run/systemd/resolve/stub-resolv.conf
    fi
    install -d /etc/systemd/system/docker.socket.d
    printf '[Socket]\nSocketUser={{.User}}\n' > /etc/systemd/system/docker.socket.d/wx.conf
    systemctl daemon-reload
    systemctl enable --now docker.socket docker.service
    chown '{{.User}}' /var/run/docker.sock
probes:
- script: |
    #!/bin/sh
    set -eu
    docker info >/dev/null
  hint: Check Docker in the external VM.
portForwards:
- guestSocket: /var/run/docker.sock
  hostSocket: '{{.Dir}}/sock/docker.sock'
- guestIP: 127.0.0.1
  guestPort: 33021
  hostIP: 127.0.0.1
  hostPort: @DESKTOP_PORT@
- guestIP: 127.0.0.1
  guestPort: 33022
  hostIP: 127.0.0.1
  hostPort: @DESKTOP_TLS_PORT@
- guestIP: 127.0.0.1
  guestPort: 33023
  hostIP: 127.0.0.1
  hostPort: @DASHBOARD_PORT@
