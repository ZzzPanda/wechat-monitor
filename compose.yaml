name: wechat-monitor
services:
  weixin:
    image: local/wechat-monitor-player:arm64-v1
    build:
      context: ./docker
    pull_policy: never
    platform: linux/arm64
    container_name: wx-playback
    hostname: wx-playback
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      LC_ALL: zh_CN.UTF-8
      PIXELFLUX_WAYLAND: "false"
      AUTO_GPU: "false"
    shm_size: 1gb
    restart: unless-stopped
    ports:
      - "127.0.0.1:33021:3000"
      - "127.0.0.1:33022:3001"
    volumes:
      - weixin-profile:/config
      - type: bind
        source: ${WECHAT_MEDIA_DIR:?set WECHAT_MEDIA_DIR}
        target: /config/Downloads
        bind:
          create_host_path: false
  dashboard:
    image: local/wechat-monitor-dashboard:arm64-v1
    build:
      context: ./dashboard
    pull_policy: never
    platform: linux/arm64
    user: "${DASHBOARD_UID:-501}:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    labels:
      com.wechat-monitor.dashboard-source: "${DASHBOARD_REVISION:-local}"
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      DASHBOARD_AUTHORS: /authors/authors.txt
      DASHBOARD_DB: /db/previews.sqlite3
      DASHBOARD_MEDIA: /media/微信视频号
      DASHBOARD_MEDIA_ROOT: /media
      WECHAT_HOST_MEDIA_ROOT: ${WECHAT_MEDIA_DIR:?set WECHAT_MEDIA_DIR}
      DASHBOARD_POSTERS: /posters
    ports:
      - "127.0.0.1:33023:8080"
    volumes:
      - type: bind
        source: ${WECHAT_STATE_DIR:?set WECHAT_STATE_DIR}/dashboard-app
        target: /app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_STATE_DIR:?set WECHAT_STATE_DIR}/wechat-pilot
        target: /db
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_MEDIA_DIR:?set WECHAT_MEDIA_DIR}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_STATE_DIR:?set WECHAT_STATE_DIR}/monitoring
        target: /authors
        bind:
          create_host_path: false
      - type: bind
        source: ${WECHAT_STATE_DIR:?set WECHAT_STATE_DIR}/posters
        target: /posters
        read_only: true
        bind:
          create_host_path: false

volumes:
  weixin-profile:
