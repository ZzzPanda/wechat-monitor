<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8f6">
  <title>视频资料库 · 视频号监控台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至视频列表</a>
  <div class="workspace">
    <aside class="rail" aria-label="资料库导航">
      <div class="brand-bar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i></span>视频号监控台</div>
        <button type="button" id="nav-toggle" class="nav-toggle quiet-button" aria-controls="navigation" aria-expanded="false">作者筛选<span class="chevron" aria-hidden="true"></span></button>
      </div>
      <nav id="navigation" class="navigation" aria-label="视频和作者">
        <h2 class="nav-heading">资料库</h2>
        <button type="button" id="all-videos" class="nav-item current" aria-current="page">
          <span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="nav-name">全部视频</span><span class="nav-count" id="all-count"></span>
        </button>
        <div class="author-group">
          <h2 class="nav-heading">监控视频号</h2>
          <div id="authors"></div>
        </div>
        <div id="past-group" class="author-group" hidden>
          <h2 class="nav-heading">历史作者</h2>
          <div id="past-authors"></div>
        </div>
      </nav>
      <div class="storage" id="storage" hidden>
        <span class="disk-icon" aria-hidden="true"></span>
        <div><span>视频占用空间</span><strong id="storage-size"></strong></div>
      </div>
    </aside>

    <main id="main" class="main">
      <header class="page-header">
        <div>
          <h1 id="page-title">视频资料库</h1>
          <div class="page-metadata">
            <p id="summary" class="summary" aria-live="polite">正在读取资料库…</p>
            <a id="saved-profile" class="saved-profile" target="_blank" rel="noopener noreferrer" hidden>视频号主页</a>
            <button id="link-profile" class="link-profile" type="button" hidden>搜索并关联主页</button>
          </div>
          <p id="saved-note" class="saved-note" hidden></p>
        </div>
        <div class="header-actions">
          <button id="start-history" class="quiet-button" type="button" hidden>拉取历史作品</button>
          <button id="edit-author" class="quiet-button" type="button" hidden>编辑</button>
          <button id="remove-author" class="quiet-button remove-link" type="button" hidden>移除</button>
          <button id="remonitor-author" class="quiet-button" type="button" hidden>重新监控</button>
          <button id="add-author" class="primary-button" type="button"><span class="plus-icon" aria-hidden="true"></span>添加视频号</button>
        </div>
      </header>
      <details class="crawl-panel" id="crawl-panel">
        <summary><strong>采集任务</strong><span id="crawl-summary" role="status"></span></summary>
        <div class="crawl-content">
          <p id="worker-offline" class="inline-error" role="status" hidden>采集进程离线，排队任务会在进程恢复后继续。</p>
          <form id="schedule-form" class="schedule-form">
            <label class="schedule-switch"><input type="checkbox" id="schedule-enabled"> 定时拉取新增作品</label>
            <label class="schedule-start">首次运行（北京时间）<input id="schedule-start" type="datetime-local" min="1970-01-01T08:00" max="9999-12-31T23:59" required></label>
            <label class="schedule-period">间隔（至少 1 小时）<input id="schedule-interval" type="number" min="60" step="1" required> 分钟</label>
            <button type="submit" class="quiet-button" id="save-schedule" disabled>保存设置</button>
          </form>
          <p id="next-crawl" class="crawl-hint"></p>
          <p id="crawl-error" class="inline-error" role="alert" hidden></p>
          <h2 class="field-label">最近任务</h2>
          <ul id="crawl-jobs" class="crawl-jobs"></ul>
          <p id="no-crawl-jobs" class="crawl-hint" hidden>暂无采集任务</p>
        </div>
      </details>
      <section aria-label="历史视频">
        <div class="toolbar">
          <label class="search"><span class="search-icon" aria-hidden="true"></span>
            <input id="query" type="search" placeholder="搜索视频或作者" aria-label="搜索视频或作者" autocomplete="off">
          </label>
          <div class="toolbar-actions">
            <label class="sort">
              <span class="sort-icon" aria-hidden="true"><i></i></span>
              <select id="sort" aria-label="视频排序">
                <option value="newest">最新发布</option>
                <option value="oldest">最早发布</option>
                <option value="title">标题排序</option>
              </select>
              <span class="chevron" aria-hidden="true"></span>
            </label>
            <button id="refresh" class="icon-button" type="button" title="刷新资料库" aria-label="刷新资料库"><span class="refresh-icon" aria-hidden="true">↻</span></button>
          </div>
        </div>
        <p id="fetch-error" class="inline-error" role="alert" hidden></p>
        <div id="videos" class="gallery" aria-label="视频列表" aria-busy="true"></div>
        <div id="empty" class="empty-state" hidden>
          <div class="empty-frame" aria-hidden="true"><span></span></div>
          <h2 id="empty-title"></h2>
          <p id="empty-text"></p>
          <button id="clear-search" type="button" class="quiet-button" hidden>清除搜索</button>
        </div>
      </section>
    </main>
  </div>

  <dialog id="edit-dialog" class="author-dialog" aria-labelledby="edit-title">
    <div class="dialog-titlebar">
      <h2 id="edit-title">编辑监控视频号</h2>
      <button class="close-button" type="button" aria-label="关闭" data-close="edit-dialog"></button>
    </div>
    <form id="edit-form">
      <div class="edit-fields">
        <div>
          <span class="field-label">监控账号</span>
          <div class="edit-profile">
            <strong id="edit-account-name"></strong>
            <button id="choose-replacement" class="link-profile" type="button">更换账号</button>
          </div>
          <a id="edit-profile-url" class="saved-profile edit-url" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
        <div>
          <label class="field-label" for="author-note">备注（选填）</label>
          <input class="text-field" id="author-note" type="text" maxlength="200" autocomplete="off">
        </div>
      </div>
      <p class="inline-error" id="edit-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="quiet-button" type="button" data-close="edit-dialog">取消</button>
        <button id="save-author" class="primary-button" type="submit" disabled>保存更改</button>
      </div>
    </form>
  </dialog>

  <dialog id="remove-dialog" class="author-dialog" aria-labelledby="remove-title" aria-describedby="remove-description">
    <div class="dialog-titlebar">
      <h2 id="remove-title">从监控名单移除？</h2>
      <button class="close-button" type="button" aria-label="关闭" data-close="remove-dialog"></button>
    </div>
    <p class="dialog-intro" id="remove-description"></p>
    <p class="inline-error" id="remove-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button class="quiet-button" type="button" data-close="remove-dialog" autofocus>取消</button>
      <button id="confirm-remove-author" class="primary-button danger-button" type="button">确认移除</button>
    </div>
  </dialog>

  <dialog id="author-dialog" class="author-dialog" aria-labelledby="author-dialog-title">
    <div class="dialog-titlebar">
      <h2 id="author-dialog-title">添加监控视频号</h2>
      <button class="close-button" type="button" aria-label="关闭" data-close="author-dialog"></button>
    </div>
    <p class="dialog-intro">用微信搜索账号，选择要监控的视频号。主页链接可在微信内打开。</p>
    <form id="author-search-form">
      <label for="author-name" class="field-label">视频号名称</label>
      <div class="author-search-row">
        <input class="text-field" id="author-name" type="search" name="q" maxlength="64" required placeholder="例如：数字生命卡兹克" autocomplete="off" enterkeyhint="search">
        <button class="quiet-button" id="search-author" type="submit">搜索</button>
      </div>
    </form>
    <p id="author-search-status" class="author-search-status" role="status"></p>
    <button id="fresh-author-search" class="fresh-search" form="author-search-form" type="submit" hidden>重新从微信搜索</button>
    <fieldset id="account-options" class="account-options" hidden>
      <legend class="field-label">选择视频号</legend>
      <div id="account-list" class="account-list"></div>
    </fieldset>
    <p class="inline-error" id="author-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button class="quiet-button" type="button" data-close="author-dialog">取消</button>
      <button class="primary-button" id="submit-author" type="button" disabled>加入监控名单</button>
    </div>
  </dialog>

  <dialog id="player-dialog" class="player-dialog" aria-labelledby="playing-title">
    <div class="player-head">
      <div><h2 id="playing-title"></h2><p id="playing-meta"></p></div>
      <button class="close-button" type="button" aria-label="关闭播放器" data-close="player-dialog"></button>
    </div>
    <video id="player" controls playsinline preload="metadata"></video>
    <p id="player-error" class="inline-error" role="alert" hidden>视频暂时无法播放，请检查外置盘上的文件后重试。</p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
